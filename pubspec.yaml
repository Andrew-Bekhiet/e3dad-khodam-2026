name: e3dad_khodam_2026
description: "An interactive Arabic map of the cities of St Paul's journeys."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  collection: ^1.19.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  solid_lints: ^0.3.3

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont.ttf
