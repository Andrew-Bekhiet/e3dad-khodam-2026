name: e3dad_khodam_2026
description: "An interactive Arabic map of the cities of St Paul's journeys."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  collection: ^1.19.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  mapbox_maps_flutter: ^2.27.0
  web: ^1.1.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  solid_lints: ^1.0.0-dev.1

flutter:
  uses-material-design: true

  assets:
    - assets/map/mapbox_streets_base_style.json
    # Declared as a directory so a character's artwork can be dropped in
    # without touching this file; missing portraits degrade to a
    # placeholder at runtime.
    - assets/characters/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont.ttf
